plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openhonor.fnepigate'
    compileSdk 35

    defaultConfig {
        applicationId 'org.openhonor.fnepigate'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2-invalid-requeue-guard'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
