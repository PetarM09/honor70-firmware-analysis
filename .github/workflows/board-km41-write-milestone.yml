name: Honor70 Trace Board Keymaster WRITE and Milestone Fuse
on:
  push:
    paths:
      - '.github/workflows/board-km41-write-milestone.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve Chinese engineering Board km41.mbn
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs report analysis dist
          gh run download 42553239190 --repo "$GITHUB_REPOSITORY" --name HONOR70_FNE_AN00_BOARD_SIGNED_BOOTCHAIN --dir inputs
          unzip -q inputs/selected_bootchain.zip bootloaderimage/km41.mbn -d inputs
          echo 'b548a4a0cfd3b21d08164600593881e5a1b57bdc960ab0a3437309bc92ba5f78  inputs/bootloaderimage/km41.mbn' | sha256sum --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Ghidra 12.2
        run: |
          curl -fL --retry 3 -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  /tmp/ghidra.zip' | sha256sum -c
          unzip -q /tmp/ghidra.zip -d dist
          rm /tmp/ghidra.zip
          echo "GHIDRA_HEADLESS=$(find dist -type f -name analyzeHeadless | head -1)" >> "$GITHUB_ENV"
      - name: Reconstruct engineering Keymaster dispatchers, milestone and state callbacks
        run: |
          mkdir -p /tmp/board-keymaster-ghidra
          "$GHIDRA_HEADLESS" /tmp/board-keymaster-ghidra BOARD_KEYMASTER \
            -import "$GITHUB_WORKSPACE/inputs/bootloaderimage/km41.mbn" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript Honor70BoardKM41WriteAndMilestoneAudit.java \
            -analysisTimeoutPerFile 750 -max-cpu 2 -deleteProject > report/BOARD_KEYMASTER_GHIDRA_LOG.txt 2>&1 || {
               tail -130 report/BOARD_KEYMASTER_GHIDRA_LOG.txt
               exit 1
            }
          test -s analysis/BOARD_KM41_WRITE_MILESTONE_DECOMPILE.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=[]
          for name in ['BOARD_KM41_WRITE_MILESTONE_DECOMPILE.txt']:
            s=Path('analysis')/name
            d=s.read_text(errors='replace')
            out.append('===== '+name+' =====')
            out.append('SIZE '+str(len(d)))
            for line in d.splitlines():
              if line.startswith(('TABLE_ENTRY','  SLOT','STRING ','IMMEDIATE ','INSTRUCTIONS','GHIDRA_FUNCTION_COUNT','====== DECOMPILE','======== FUNCTION','Function ')):
                out.append(line)
          text='\n'.join(out)
          Path('report/BOARD_KM41_DISPATCHER_INDEX.txt').write_text(text)
          print(text[:55000])
          PY
      - name: Upload complete static report
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_BOARD_KM41_EXACT_WRITE_MILESTONE
          path: |
            analysis/
            report/
          retention-days: 14
