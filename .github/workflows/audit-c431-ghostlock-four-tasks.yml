name: HONOR70 C431 Four Remaining GhostLock Evidence Tasks

on:
  push:
    paths:
      - 'tools/audit_c431_ghostlock_four_remaining_tasks.py'
      - 'tools/test_audit_c431_ghostlock_four_remaining_tasks.py'
      - '.github/workflows/audit-c431-ghostlock-four-tasks.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run 12 fail-closed evidence regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_c431_ghostlock_four_remaining_tasks.py
          python3 -m unittest discover -s tools \
            -p 'test_audit_c431_ghostlock_four_remaining_tasks.py' -v
      - name: Retrieve already-verified signed C431 research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/{chain,direct,stack,waiter,hardening} report
          gh run download 43274625423 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_C431_ORIGINAL_GHOSTLOCK_PROXY_CHAIN \
            --dir inputs/chain
          gh run download 43275022781 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_C431_FUTEX_DIRECT_PROXY_EDGE \
            --dir inputs/direct
          gh run download 43283106736 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_C431_CONDITIONAL_STACK_INTERVALS \
            --dir inputs/stack
          gh run download 43282279278 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_C431_VERIFIED_LOCAL_WAITER_PROVENANCE \
            --dir inputs/waiter
          gh run download 43287116480 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_C431_VERIFIED_KERNEL_HARDENING \
            --dir inputs/hardening
      - name: Evaluate only independently supported four-task evidence
        run: |
          set -euo pipefail
          python3 tools/audit_c431_ghostlock_four_remaining_tasks.py \
            --chain inputs/chain/C431_ORIGINAL_GHOSTLOCK_PROXY_ROLLBACK_CHAIN.json \
            --direct inputs/direct/ORIGINAL_C431_FUTEX_DIRECT_PROXY_EDGE.json \
            --stack inputs/stack/ORIGINAL_C431_CONDITIONAL_STACK_FRAME_INTERSECTION.json \
            --waiter inputs/waiter/C431_INLINED_WAITER_FRAME_POINTER_EVIDENCE.json \
            --hardening inputs/hardening/FNE_NX9_C431_ORIGINAL_KERNEL_HARDENING.json \
            --out report/C431_GHOSTLOCK_FOUR_TASK_EVIDENCE_STATUS.json \
            | tee report/STATUS_SUMMARY.txt
          python3 -m json.tool report/C431_GHOSTLOCK_FOUR_TASK_EVIDENCE_STATUS.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: HONOR70_C431_GHOSTLOCK_FOUR_TASK_EVIDENCE_STATUS
          path: report/
          if-no-files-found: error
          retention-days: 30
