name: HONOR70 Exact C431 Waiter Field Source+ARM64 Crosscheck

on:
  push:
    paths:
      - 'tools/assert_exact_c431_waiter_field_evidence.py'
      - 'tools/test_assert_exact_c431_waiter_field_evidence.py'
      - '.github/workflows/assert-exact-c431-waiter-layout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source_binary_crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic source+machine code binding
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assert_exact_c431_waiter_field_evidence.py
          python3 -m unittest discover -s tools -p 'test_assert_exact_c431_waiter_field_evidence.py' -v
      - name: Download original verified C431 binary audit and HONOR GPL sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/arm64 evidence/fennie report
          gh run download 43228277888 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_EXACT_C431_ARM64_RT_MUTEX_ABI_SITES \
            --dir evidence/arm64
          gh run download 43162235496 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_FENNIE_8_CORE_KERNEL_SOURCES \
            --dir evidence/fennie
          echo 'c79353d84625e4d352be7d96193cf162fba7857a85171540996f499679ea3d08  evidence/fennie/FENNIE/kernel_rtmutex_common_h.txt' | sha256sum -c
          echo '70f96efb8e45b97b977957e3ecb93a4e63fcaf4e2b7d915d20316f3c4e6263b9  evidence/fennie/FENNIE/kernel_rtmutex_c.txt' | sha256sum -c
      - name: Produce original stock waiter field confidence report
        run: |
          set -euo pipefail
          python3 tools/assert_exact_c431_waiter_field_evidence.py \
            --arm64-report evidence/arm64/C431_ORIGINAL_RT_MUTEX_MEMORY_INSTRUCTIONS.json \
            --source-waiter-header evidence/fennie/FENNIE/kernel_rtmutex_common_h.txt \
            --source-rtmutex-c evidence/fennie/FENNIE/kernel_rtmutex_c.txt \
            --out report/EXACT_C431_WAITERS_VERIFIED_SOURCE_AND_BINARY.json
          python3 -m json.tool report/EXACT_C431_WAITERS_VERIFIED_SOURCE_AND_BINARY.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HONOR70_C431_VERIFIED_WAITER_FIELDS
          path: report/
          retention-days: 30
          if-no-files-found: warn
