
name: Honor 70 Firmware Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download all firmware parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts report
          gh release download v8.0.0.290 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "HONOR70_FW_part_*" \
            --dir parts
          ls -lh parts/
          sha256sum parts/* > report/PART_SHA256.txt

      - name: Inspect split ZIP without rebuilding 6 GB file
        run: |
          python3 - <<'PY'
          import bisect
          import hashlib
          import zipfile
          from pathlib import Path

          parts = sorted(Path("parts").glob("HONOR70_FW_part_*"))
          expected = [
              f"HONOR70_FW_part_aa{chr(97+i)}"
              for i in range(14)
          ]
          assert [p.name for p in parts] == expected, \
              "Missing or incorrectly named firmware parts"

          class SplitReader:
              def __init__(self, paths):
                  self.files = [p.open("rb") for p in paths]
                  self.offsets = [0]
                  for p in paths:
                      self.offsets.append(
                          self.offsets[-1] + p.stat().st_size
                      )
                  self.pos = 0

              def tell(self):
                  return self.pos

              def seekable(self):
                  return True

              def seek(self, offset, whence=0):
                  base = [0, self.pos, self.offsets[-1]][whence]
                  self.pos = base + offset
                  if self.pos < 0:
                      raise ValueError("Negative seek")
                  return self.pos

              def read(self, n=-1):
                  total = self.offsets[-1]
                  if n is None or n < 0:
                      n = total - self.pos
                  n = min(n, max(0, total-self.pos))
                  out = bytearray()
                  while n:
                      i = bisect.bisect_right(
                          self.offsets, self.pos
                      ) - 1
                      if i >= len(self.files):
                          break
                      count = min(
                          n, self.offsets[i+1]-self.pos
                      )
                      f = self.files[i]
                      f.seek(self.pos-self.offsets[i])
                      chunk = f.read(count)
                      if len(chunk) != count:
                          raise IOError("Incomplete firmware part")
                      out.extend(chunk)
                      self.pos += count
                      n -= count
                  return bytes(out)

              def close(self):
                  for f in self.files:
                      f.close()

          reader = SplitReader(parts)
          try:
              with zipfile.ZipFile(reader) as z:
                  entries = z.infolist()

                  with open("report/MANIFEST.tsv", "w") as out:
                      out.write("Name\tSize\tCompressed\tCRC32\n")
                      for e in entries:
                          out.write(
                              f"{e.filename}\t{e.file_size}\t"
                              f"{e.compress_size}\t{e.CRC:08x}\n"
                          )

                  terms = [
                      "abl", "xbl", "bootloader",
                      "oeminfo", "antitheft", "vbmeta",
                      "partition", "manifest",
                      "rawprogram", "firehose",
                      "hwsecurity", "sepolicy"
                  ]

                  candidates = [
                      e for e in entries
                      if not e.is_dir()
                      and any(t in e.filename.lower() for t in terms)
                  ]

                  with open("report/SUMMARY.txt", "w") as out:
                      print("ZIP valid: central directory readable",
                            file=out)
                      print("Parts:", len(parts), file=out)
                      print("ZIP entries:", len(entries), file=out)
                      print("\nRelevant candidates:", file=out)
                      for e in candidates:
                          print(e.filename, e.file_size, file=out)
                      print("\nLargest entries:", file=out)
                      for e in sorted(
                          entries,
                          key=lambda x: x.file_size,
                          reverse=True
                      )[:30]:
                          print(e.filename, e.file_size, file=out)

                  target = Path("report/samples")
                  target.mkdir(exist_ok=True)
                  total_extracted = 0

                  for e in sorted(candidates,
                                  key=lambda x: x.file_size):
                      if e.file_size > 12*1024*1024:
                          continue
                      if total_extracted + e.file_size > 40*1024*1024:
                          break
                      name = hashlib.sha256(
                          e.filename.encode()
                      ).hexdigest()[:12]
                      dest = target / (name + "_" +
                                       Path(e.filename).name)
                      dest.write_bytes(z.read(e))
                      total_extracted += e.file_size

          finally:
              reader.close()

          print("Inspection completed")
          PY

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_FIRMWARE_REPORT
          path: report/
          retention-days: 7
