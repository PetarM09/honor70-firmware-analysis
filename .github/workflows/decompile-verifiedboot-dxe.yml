name: Honor70 Decompile XBL VerifiedBootDxe
on:
  push:
    paths:
      - '.github/workflows/decompile-verifiedboot-dxe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch firmware release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts results
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
          df -h .
      - name: Extract and inspect nested ZIP safely
        run: |
          python3 - <<'PY'
          import bisect, zipfile, shutil, os, hashlib
          from pathlib import Path

          files=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          expected=[f'HONOR70_FW_part_aa{chr(97+i)}' for i in range(14)]
          assert [p.name for p in files]==expected, 'Firmware parts missing or out of order'
          class Joined:
              def __init__(self,files):
                  self.fs=[p.open('rb') for p in files]; self.ends=[0]
                  for p in files:self.ends.append(self.ends[-1]+p.stat().st_size)
                  self.pos=0
              def seekable(self):return True
              def tell(self):return self.pos
              def seek(self,o,w=0):
                  self.pos=([0,self.pos,self.ends[-1]][w])+o
                  if self.pos<0:raise ValueError('negative seek')
                  return self.pos
              def read(self,n=-1):
                  if n is None or n<0:n=self.ends[-1]-self.pos
                  n=min(n,max(0,self.ends[-1]-self.pos))
                  out=bytearray()
                  while n:
                      i=bisect.bisect_right(self.ends,self.pos)-1
                      if i>=len(self.fs):break
                      count=min(n,self.ends[i+1]-self.pos)
                      f=self.fs[i];f.seek(self.pos-self.ends[i])
                      c=f.read(count)
                      if len(c)!=count:raise IOError('incomplete firmware piece')
                      out.extend(c); self.pos+=count;n-=count
                  return bytes(out)
              def close(self):
                  for f in self.fs:f.close()

          reader=Joined(files)
          inner_path=Path('update_sd_base.zip')
          try:
              with zipfile.ZipFile(reader) as outer:
                  info=outer.getinfo('Software/dload/update_sd_base.zip')
                  print('OUTER_MEMBER',info.filename,info.file_size,info.compress_size)
                  free=shutil.disk_usage('.').free
                  if free < info.file_size+1024**3:
                      raise RuntimeError('Insufficient disk space to safely extract inner ZIP')
                  with outer.open(info) as stream,inner_path.open('wb') as dst:
                      shutil.copyfileobj(stream,dst,8*1024*1024)
          finally:
              reader.close()

          with zipfile.ZipFile(inner_path) as inner:
              for name in ('image/xbl.elf','image/abl.elf'):
                  output=Path('results')/Path(name).name
                  with inner.open(name) as source,output.open('wb') as dst:
                      shutil.copyfileobj(source,dst,1024*1024)
                  print('EXTRACTED_FOR_PARSER',name,output.stat().st_size,hashlib.sha256(output.read_bytes()).hexdigest())
          PY
      - name: Install official UEFI firmware parser and decompress module volumes
        run: |
          python3 -m pip install --quiet --break-system-packages uefi_firmware==1.16
          uefi-firmware-parser --help | head -50
          mkdir -p extracted/abl extracted/xbl
          timeout 100 uefi-firmware-parser -b -e -o extracted/abl results/abl.elf > results/PARSER_ABL_LOG.txt 2>&1 || true
          timeout 100 uefi-firmware-parser -b -e -o extracted/xbl results/xbl.elf > results/PARSER_XBL_LOG.txt 2>&1 || true
          echo 'PARSED_BINARY_COUNT'
          find extracted -type f | wc -l
      - name: Locate actual protocol symbol / GUID after UEFI decompression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import uuid,re,hashlib
          guid=uuid.UUID('8e5eff91-21b6-47d3-af2b-c15a01e020ec').bytes_le
          patterns={'VERIFIED_BOOT_PROTOCOL_GUID':guid,'VBRwDevice':b'VBRwDevice',
                    'OEMINFO_ID_TRANSFORM':b'oeminfo_id_transform','FlashLock':b'FlashLock',
                    'get_unlock_ability':b'get_unlock_ability',
                    'VerifiedBoot':b'VerifiedBoot'}
          lines=[]
          files=sorted(x for x in Path('extracted').rglob('*') if x.is_file())
          lines.append('NUMBER_OF_DECOMPRESSED_MODULE_FILES '+str(len(files)))
          for p in files:
            try:
              if p.stat().st_size>24*1024*1024:continue
              b=p.read_bytes()
              matches=[]
              for key,pat in patterns.items():
                loc=[m.start() for m in re.finditer(re.escape(pat),b)]
                if loc:matches.append(key+'='+','.join(hex(x) for x in loc[:12]))
              if matches:
                lines.append('MODULE '+str(p)+' SIZE='+str(len(b))+' SHA256='+hashlib.sha256(b).hexdigest()+' MATCHES '+' '.join(matches))
            except Exception as exc:
              lines.append('ERROR '+str(p)+': '+str(exc))
          for img in ('abl','xbl'):
            log=Path('results/PARSER_'+img.upper()+'_LOG.txt').read_text(errors='replace')
            lines.append('PARSER_LOG_'+img.upper()+'_SIZE '+str(len(log)))
            lines.append('PARSER_LOG_'+img.upper()+'_HEAD '+log[:3600])
          txt='\\n'.join(lines)+'\\n'
          Path('results/DECOMPRESSED_VERIFIED_BOOT_PROVIDER.txt').write_text(txt)
          print(txt[:28000])
          PY
      - name: Extract exact VerifiedBootDxe PE and addresses
        run: |
          python3 -m pip install --quiet --break-system-packages pefile
          python3 - <<'PY'
          import pefile,hashlib
          from pathlib import Path
          paths=list(Path('extracted/xbl').rglob('file-a25f5839-4d55-428f-8f0b-5ce1d565f53e/section1.pe'))
          assert len(paths)==1, 'Expected exactly one DXE section1 PE from UEFI metadata'
          b=paths[0].read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          assert sha=='f7a2778d20067ebe97a4be7fdd2bb79a06456b8ddb07ab8a37c63951ec1c0c55'
          pe=pefile.PE(data=b,fast_load=True)
          marker=bytes.fromhex('91ff5e8eb621d347af2bc15a01e020ec')
          off=b.find(marker)
          assert off>=0
          rva=pe.get_rva_from_offset(off)
          entry=pe.OPTIONAL_HEADER.AddressOfEntryPoint
          Path('VB_DRIVER.efi').write_bytes(b)
          Path('results/VB_DRIVER_METADATA.txt').write_text(f'VerifiedBootDxe SHA256={sha}\nENTRY_RVA=0x{entry:x}\nGUID_RVA=0x{rva:x}\nGUID_FILE_OFF=0x{off:x}\n')
          with open('.env.tmp','w') as f:
            f.write(f'GUID_RVA=0x{rva:x}\nENTRY_RVA=0x{entry:x}\n')
          print(Path('results/VB_DRIVER_METADATA.txt').read_text())
          PY
          cat .env.tmp >> "$GITHUB_ENV"
      - name: Download pinned Ghidra 12.2 and Java 25
        run: |
          curl -fL --retry 3 -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  /tmp/ghidra.zip' | sha256sum -c
          mkdir -p ghidra-dist
          unzip -q /tmp/ghidra.zip -d ghidra-dist
          rm /tmp/ghidra.zip
          echo "GHIDRA_HEADLESS=$(find ghidra-dist -type f -name analyzeHeadless | head -1)" >> "$GITHUB_ENV"
      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Decompile VerifiedBootDxe interface, callbacks and state backend
        run: |
          mkdir -p /tmp/ghidra-verifiedboot report
          "$GHIDRA_HEADLESS" /tmp/ghidra-verifiedboot HONOR70_VerifiedBootDxe \
            -import "$GITHUB_WORKSPACE/VB_DRIVER.efi" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript Honor70VerifiedBootDxeAudit.java "$GUID_RVA" "$ENTRY_RVA" \
            -analysisTimeoutPerFile 600 -max-cpu 2 -deleteProject \
            > results/VB_GHIDRA_LOG.txt 2>&1 || {
              tail -120 results/VB_GHIDRA_LOG.txt
              exit 1
            }
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('report/VERIFIEDBOOT_DXE_GHIDRA.txt')
          d=p.read_text(errors='replace')
          heads=d[:2500]
          blocks=re.split(r'(?=^======== FUNCTION )',d,flags=re.M)
          keys=('rpmb','devinfo','unlock','lockstate','scm','qsee','device state','secure storage','write_config','read_config','partition')
          hits=[]
          for b in blocks:
              if not b.startswith('======== FUNCTION'):continue
              found=[k for k in keys if k in b.lower()]
              if found:
                  hits.append('KEYWORDS '+','.join(found)+'\n'+b[:9000])
          text=heads+'\n'+('\n'.join(hits[:32]))
          Path('report/VERIFIEDBOOT_DXE_RELEVANT_PATHS.txt').write_text(text)
          print('FUNCTIONS',len(blocks)-1,'KEYWORD_HITS',len(hits),'REPORT_BYTES',len(d))
          print(text[:49000])
          PY
      - name: Upload text-only reverse engineering reports
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_VERIFIEDBOOT_DXE_GHIDRA
          path: |
            report/VERIFIEDBOOT_DXE_GHIDRA.txt
            report/VERIFIEDBOOT_DXE_RELEVANT_PATHS.txt
            results/VB_DRIVER_METADATA.txt
            results/VB_GHIDRA_LOG.txt
          retention-days: 14
