name: Honor 70 Deep Bootchain
on:
  push:
    paths:
      - '.github/workflows/deep-bootchain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download signed firmware parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts output keybins
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
      - name: Parse ELF segments, headers, signatures and entropy
        run: |
          python3 - <<'PY'
          import bisect,zipfile,shutil,subprocess,math,hashlib,struct,re
          from pathlib import Path
          paths=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          assert [p.name for p in paths] == [f'HONOR70_FW_part_aa{chr(97+i)}' for i in range(14)]
          class Joined:
            def __init__(self,paths):
              self.fs=[p.open('rb') for p in paths];self.end=[0];self.pos=0
              for p in paths:self.end.append(self.end[-1]+p.stat().st_size)
            def tell(self):return self.pos
            def seekable(self):return True
            def seek(self,v,w=0):self.pos=[0,self.pos,self.end[-1]][w]+v;return self.pos
            def read(self,n=-1):
              if n<0:n=self.end[-1]-self.pos
              n=min(n,max(0,self.end[-1]-self.pos));out=bytearray()
              while n:
                i=bisect.bisect_right(self.end,self.pos)-1
                if i>=len(self.fs):break
                size=min(n,self.end[i+1]-self.pos)
                self.fs[i].seek(self.pos-self.end[i]);data=self.fs[i].read(size)
                if len(data)!=size:raise IOError('short part')
                out+=data;self.pos+=size;n-=size
              return bytes(out)
            def close(self):
              for f in self.fs:f.close()
          joined=Joined(paths)
          try:
            with zipfile.ZipFile(joined) as outer:
              entry=outer.getinfo('Software/dload/update_sd_base.zip')
              assert shutil.disk_usage('.').free > entry.file_size+1024**3
              with outer.open(entry) as r,open('base.zip','wb') as w:shutil.copyfileobj(r,w,8*1024*1024)
          finally:joined.close()
          targets=['image/abl.elf','image/xbl.elf','image/xbl_config.elf','image/tz.mbn',
                   'image/uefi_sec.mbn','image/featenabler.mbn','image/vbmeta.img',
                   'image/boot.img','image/vendor_boot.img','image/kpatch.img']
          with zipfile.ZipFile('base.zip') as z:
            for name in targets:
              if name in z.namelist():
                dest=Path('keybins')/name.rsplit('/',1)[-1]
                with z.open(name) as r,dest.open('wb') as w:shutil.copyfileobj(r,w,4*1024*1024)
          def entropy(b):
            if not b:return 0
            count=[0]*256
            for v in b:count[v]+=1
            return round(-sum((c/len(b))*math.log2(c/len(b)) for c in count if c),3)
          terms=re.compile(rb'(?i)bootloader|fastboot|unlock|lockstate|oeminfo|verify|factory|sig(nature|naturetool)?|auth|rollback|debug|efi|uefi|LinuxLoader|bootstate')
          report=[]
          for p in Path('keybins').iterdir():
            data=p.read_bytes()
            report += [f'\n========== {p.name} ==========',
                       f'SIZE {len(data)} SHA256 {hashlib.sha256(data).hexdigest()}',
                       f'PREFIX_HEX {data[:64].hex()}',
                       'FILE: '+subprocess.run(['file','-b',str(p)],capture_output=True,text=True).stdout.strip()]
            if data[:4]==b'\x7fELF':
              for argv in [['readelf','-h',str(p)],['readelf','-l','-W',str(p)]]:
                result=subprocess.run(argv,capture_output=True,text=True)
                report += ['$ '+' '.join(argv),result.stdout[:14000],result.stderr[:1000]]
              elf_class=data[4];order='<' if data[5]==1 else '>'
              try:
                if elf_class==1:
                  phoff=struct.unpack_from(order+'I',data,28)[0]
                  phentsize=struct.unpack_from(order+'H',data,42)[0]
                  phnum=struct.unpack_from(order+'H',data,44)[0]
                  fmt=order+'IIIIIIII'
                elif elf_class==2:
                  phoff=struct.unpack_from(order+'Q',data,32)[0]
                  phentsize=struct.unpack_from(order+'H',data,54)[0]
                  phnum=struct.unpack_from(order+'H',data,56)[0]
                  fmt=order+'IIQQQQQQ'
                else:raise ValueError('elf class')
                for i in range(min(phnum,32)):
                  fields=struct.unpack_from(fmt,data,phoff+i*phentsize)
                  typ,off,sz=(fields[0],fields[1],fields[4]) if elf_class==1 else (fields[0],fields[2],fields[5])
                  chunk=data[off:min(len(data),off+sz)]
                  report.append(f'SEGMENT {i}: type={typ} file_offset=0x{off:x} file_bytes={sz} entropy={entropy(chunk[:min(len(chunk),300000)])}')
              except Exception as e:report.append('SEGMENT_PARSE_ERROR '+str(e))
            for marker in [b'MZ',b'_FVH',b'LinuxLoader',b'EFI ',b'\x1f\x8b',b'\xfd7zXZ\x00',b'PK\x03\x04',b'ANDROID!',b'\x04\x22\x4d\x18']:
              positions=[m.start() for m in list(re.finditer(re.escape(marker),data))[:16]]
              if positions:report.append('MARKER '+repr(marker)+' OFFSETS '+','.join(hex(x) for x in positions))
            for m in re.finditer(rb'[ -~]{5,}',data):
              line=m.group(0)
              if terms.search(line):
                report.append(f'STRING 0x{m.start():x} {line[:180].decode("ascii","replace")}')
                if len(report)>3000:break
          Path('output/DEEP_BOOTCHAIN.txt').write_text('\n'.join(report))
          for line in report:
            if any(line.startswith(x) for x in ['========','SIZE ','FILE:','SEGMENT ','MARKER ','PREFIX_']):
              print(line[:500])
          PY
      - name: Upload analysis logs and compact bootchain binaries
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_DEEP_BOOTCHAIN
          path: |
            output/
            keybins/abl.elf
            keybins/xbl.elf
            keybins/xbl_config.elf
            keybins/tz.mbn
            keybins/uefi_sec.mbn
            keybins/featenabler.mbn
            keybins/vbmeta.img
          retention-days: 7
