name: Honor 70 Trace Unlock Decision Functions
on:
  push:
    paths:
      - '.github/workflows/trace-unlock-decisions.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Get verified ABL and Capstone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src output
          gh run download 42527588771 --repo "$GITHUB_REPOSITORY" --name HONOR70_ABL_MODULES --dir src
          python3 -m pip install --quiet --break-system-packages capstone
      - name: Trace helper routines referenced by unlock gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          d=next(Path('src').glob('*.efi')).read_bytes()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          regions=[
             ('GATE_FLAGS',0x27a30,0x27b90),
             ('GATE_MISC',0x27d00,0x27e20),
             ('STATE_CHECK',0x43300,0x434b0),
             ('STATE_CHANGE',0x435d0,0x43760),
             ('LOCK_PERMISSION',0x304b0,0x30610),
             ('CRYPTO_RETURN',0x3da00,0x3db80),
             ('FACTORY_GATE',0x55da0,0x55eb0),
          ]
          for name,a,b in regions:
            lines=[f'=== {name} 0x{a:x}..0x{b:x} ===']
            for ins in md.disasm(d[a:b],a):
              lines.append(f'{ins.address:08x} {ins.mnemonic:8} {ins.op_str}')
            Path('output/'+name+'.txt').write_text('\n'.join(lines)+'\n')
            print('\n'.join(lines)[:19000])
          PY
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_UNLOCK_DECISION_TRACE
          path: output/
          retention-days: 7
