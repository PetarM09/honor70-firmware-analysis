name: Honor 70 Generate Experimental GhostLock Profile
on:
  push:
    paths:
      - '.github/workflows/generate-ghostlock-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download validated original boot.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p images report
          gh run download 42530238358 --repo "$GITHUB_REPOSITORY" --name HONOR70_STOCK_BOOT_FOR_GHOSTLOCK_PROFILE --dir images
          echo '5f27556ef26cf84f8ad6ff304a966c4b246091c01c89d8fd8f33e5526f7f3256  images/boot.img' | sha256sum --check
      - name: Fetch pinned upstream extractor
        run: |
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/YuKongA/ghostlock-app.git
          git -C upstream fetch --quiet --depth=1 origin 4ebc726b9001d79f3c374c917d51569e310df6bc
          git -C upstream checkout --quiet FETCH_HEAD
          echo "EXTRACTOR_SOURCE_REV=$(git -C upstream rev-parse HEAD)"
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Compile Rust extractor
        run: |
          cd upstream/tools/extract_rs
          cargo build --release > ../../../report/CARGO_BUILD.txt 2>&1 || { tail -100 ../../../report/CARGO_BUILD.txt; exit 1; }
          find ../.. -name ghostlock-extract -type f -executable -print
      - name: Independently recover kernel kallsyms
        run: |
          python3 -m pip install --quiet --break-system-packages vmlinux-to-elf
          mkdir -p work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          img=Path('images/boot.img').read_bytes()
          assert img[:8]==b'ANDROID!'
          assert struct.unpack_from('<I',img,40)[0]==3
          size=struct.unpack_from('<I',img,8)[0]
          data=img[4096:4096+size]
          assert hashlib.sha256(data).hexdigest()=='bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece'
          Path('work/Image').write_bytes(data)
          PY
          vmlinux-to-elf work/Image work/vmlinux.elf > report/VMLINUX_RECOVERY.txt 2>&1
          nm -n --defined-only work/vmlinux.elf > work/kallsyms.txt
          grep -E ' (remove_waiter|_text|init_task|init_cred)$' work/kallsyms.txt | head -20 || true
          echo "KALLSYMS_LINES=$(wc -l < work/kallsyms.txt)"
      - name: Generate profile candidate without executing exploit
        run: |
          set +e
          EXTRACTOR=$(find upstream -name ghostlock-extract -type f -executable | head -1)
          echo "RUNNING=$EXTRACTOR"
          "$EXTRACTOR" images/boot.img --kallsyms work/kallsyms.txt --format conf --out report/HONOR70_CANDIDATE.conf > report/EXTRACTOR_LOG.txt 2>&1
          RC=$?
          echo "EXTRACTOR_EXIT=$RC"
          tail -100 report/EXTRACTOR_LOG.txt
          if [ -f report/HONOR70_CANDIDATE.conf ]; then
            echo "=== CANDIDATE PROFILE ==="
            cat report/HONOR70_CANDIDATE.conf
          fi
          printf 'Candidate profile is UNVERIFIED and not approved for execution on device.\nExact kernel release must match adb shell uname -r.\nWrong offsets can trigger kernel memory corruption or reboot.\n' > report/SAFETY.txt
          exit 0
      - name: Save offline profile extraction results
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_GHOSTLOCK_EXPERIMENTAL_PROFILE
          path: report/
          retention-days: 7
