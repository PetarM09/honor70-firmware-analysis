name: HONOR70 KM41 Secondary Secure-State Handler Semantic Audit
on:
  push:
    paths:
      - '.github/workflows/audit-km41-secondary-protected-commands.yml'
      - 'tools/ghidra/Honor70KM41ExtraStateHandlerAudit.java'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out analysis scripts
        uses: actions/checkout@v4
      - name: Retrieve stock signed Keymaster
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples analysis
          gh run download 42539482630 --repo "$GITHUB_REPOSITORY" --name HONOR70_MATCHING_SECURE_BOOT_MODULES --dir samples
          sha256sum samples/exports/km41.mbn
          echo "c7f389b80444a9c9e3956efd427abbae1b5b2753b3c905107ca7888dca496afd  samples/exports/km41.mbn" | sha256sum -c
      - name: Obtain pinned Ghidra
        run: |
          curl -fL --retry 3 -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  /tmp/ghidra.zip' | sha256sum -c
          mkdir -p dist
          unzip -q /tmp/ghidra.zip -d dist
          rm /tmp/ghidra.zip
          echo "GHIDRA_HEADLESS=$(find dist -type f -name analyzeHeadless | head -1)" >> "$GITHUB_ENV"
      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect original 0x201/0x208/0x211 software fuse and 0x205/0x207/0x215 handlers
        run: |
          mkdir -p /tmp/ghidra-km41
          "$GHIDRA_HEADLESS" /tmp/ghidra-km41 HONOR70_KM41 \
            -import "$GITHUB_WORKSPACE/samples/exports/km41.mbn" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript Honor70KM41ExtraStateHandlerAudit.java \
            -analysisTimeoutPerFile 950 -max-cpu 2 -deleteProject \
            > analysis/GHIDRA_KEYMASTER_LOG.txt 2>&1 || {
              tail -120 analysis/GHIDRA_KEYMASTER_LOG.txt
              exit 1
            }
          python3 - <<'PY'
          from pathlib import Path
          import re
          report=Path('analysis/HONOR70_KM41_EXTRA_STATE_HANDLERS.txt')
          assert report.is_file()
          data=report.read_text(errors='replace')
          sections=re.findall(r'(?m)^===== COMMAND 0x([0-9a-f]+) HANDLER 0x([0-9a-f]+) =====$',data)
          assert len(sections)==8,sections
          for id,addr in sections:
            marker=f'===== COMMAND 0x{id} HANDLER 0x{addr} ====='
            st=data.index(marker)
            en=data.find('===== COMMAND ',st+len(marker))
            section=data[st:en if en>0 else None]
            print('KM41_EXTRA_SIGNED_COMMAND',id,addr)
            print(section[:11500])
          assert "NO_FUNCTION" not in data
          assert "DECOMP_ERROR" not in data
          print('KM41_EIGHT_SECURITY_HANDLERS_RECOVERED',len(sections))
          PY
      - name: Save complete read-only reverse engineering result
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_KM41_SECONDARY_GATED_AND_RESET_HANDLERS
          path: analysis/
          retention-days: 14
