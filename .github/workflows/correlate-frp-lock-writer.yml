name: Honor70 Correlate FRP Service and Persistent Lock Writer
on:
  push:
    paths:
      - '.github/workflows/correlate-frp-lock-writer.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve already-completed firmware analysis artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source/ghidra source/system report
          gh run download 42534116570 --repo "$GITHUB_REPOSITORY" --name HONOR70_GHIDRA_UNLOCK_DECOMPILATION --dir source/ghidra
          gh run download 42533989312 --repo "$GITHUB_REPOSITORY" --name HONOR70_SYSTEM_OEM_UNLOCK_SERVICES --dir source/system
          ls -lh source/ghidra source/system
      - name: Extract relevant original lock-state and Android methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gh=Path('source/ghidra/GHIDRA_ABL_DECOMPILATION.txt').read_text(errors='replace')
          service=Path('source/system/SYSTEM_OEM_UNLOCK_SERVICES.txt').read_text(errors='replace')
          report=[]
          targets=['00037ac0','00037bd0','00038370','00013054','00013008','000304e0','0003cdf8','0003c718','00037b70','00043688']
          for target in targets:
              matches=[m for m in re.finditer(r'^========== TARGET [^\n]*',gh,flags=re.M) if target.lower() in m.group().lower()]
              for m in matches:
                  next_section=re.search(r'^========== TARGET ',gh[m.end():],flags=re.M)
                  stop=m.end()+next_section.start() if next_section else len(gh)
                  content=gh[m.start():stop]
                  report.append('\n== ABL '+target+' ==\n'+content[:28000])
          classes=['Lcom/android/server/PersistentDataBlockService;',
                   'Lcom/android/server/OemLockService;',
                   'Lcom/android/server/PersistentDataBlockService$1;']
          for klass in classes:
              i=service.find('===== CLASS '+klass+' =====')
              if i<0:
                  report.append('NOT_FOUND_CLASS '+klass);continue
              end=service.find('===== CLASS ',i+10)
              block=service[i:end if end>i else None]
              parts=re.split(r'(?=^METHOD )',block,flags=re.M)
              report.append('== ANDROID '+klass+' ==')
              report.append('METHOD_NAMES '+', '.join(x.splitlines()[0].split(' ',1)[1] for x in parts if x.startswith('METHOD ')))
              patterns=('oemunlock','isunlock','getunlock','setunlock','getblockdevice','forcedigest','checksum','hash','formatpartition','oemlock','allowedbyuser','carrier','bydevice')
              for item in parts:
                  if not item.startswith('METHOD '):continue
                  title=item.splitlines()[0]
                  if any(k in title.lower() for k in patterns):
                      report.append('== '+title+' ==\n'+item[:13000])
          out='\n'.join(report)
          Path('report/HONOR70_FRP_AND_LOCK_WRITER_CORRELATION.txt').write_text(out+'\n')
          print('SUMMARY_BYTES',len(out),'GHIDRA_BYTES',len(gh),'SYSTEM_BYTES',len(service))
          for p in report:
              if p.lstrip().startswith('=='):
                  print(p[:5000])
          PY
      - name: Upload compact correlation report
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_FRP_LOCK_CORRELATION
          path: report/
          retention-days: 14
