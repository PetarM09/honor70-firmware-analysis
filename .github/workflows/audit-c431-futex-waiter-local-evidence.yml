name: HONOR70 C431 Futex Waiter Stack Source and Binary Evidence

on:
  push:
    paths:
      - 'tools/audit_c431_waiter_local_source_binary.py'
      - 'tools/test_audit_c431_waiter_local_source_binary.py'
      - '.github/workflows/audit-c431-futex-waiter-local-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test local-stack evidence scanner without firmware or exploit
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_c431_waiter_local_source_binary.py
          python3 -m unittest discover -s tools \
            -p 'test_audit_c431_waiter_local_source_binary.py' -v
      - name: Download and SHA-verify stock C431 boot and HONOR Fennie GPL futex source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source data gpl report
          gh run download 42530238358 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_STOCK_BOOT_FOR_GHOSTLOCK_PROFILE \
            --dir source
          gh run download 43162235496 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_FENNIE_8_CORE_KERNEL_SOURCES \
            --dir gpl
          echo '5f27556ef26cf84f8ad6ff304a966c4b246091c01c89d8fd8f33e5526f7f3256  source/boot.img' | sha256sum -c
          echo '71b9c7591dc611e6f92e742858bcc044cf01b605208058498e31d444b7704106  gpl/FENNIE/kernel_futex_c.txt' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import struct,hashlib
          b=Path('source/boot.img').read_bytes()
          assert b[:8]==b'ANDROID!' and struct.unpack_from('<I',b,40)[0]==3
          size=struct.unpack_from('<I',b,8)[0]
          raw=b[4096:4096+size]
          assert hashlib.sha256(raw).hexdigest()=='bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece'
          Path('data/kernel.Image').write_bytes(raw)
          PY
      - name: Disassemble exact C431 futex and select functions and report stack syntax
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages \
            vmlinux-to-elf 'capstone>=5,<6' 'pyelftools>=0.31,<0.34'
          vmlinux-to-elf data/kernel.Image data/vmlinux.elf > report/VMLINUX_RECOVERY.txt 2>&1 || {
            tail -35 report/VMLINUX_RECOVERY.txt
            exit 1
          }
          python3 tools/audit_c431_waiter_local_source_binary.py \
            --boot source/boot.img \
            --kernel data/kernel.Image \
            --elf data/vmlinux.elf \
            --fennie-futex gpl/FENNIE/kernel_futex_c.txt \
            --out report/C431_FUTEX_WAITER_SOURCE_BINARY_STACK_EVIDENCE.json \
            | tee report/WAITER_STACK_SUMMARY.txt
          python3 -m json.tool report/C431_FUTEX_WAITER_SOURCE_BINARY_STACK_EVIDENCE.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HONOR70_C431_FUTEX_WAITER_STACK_STATIC_EVIDENCE
          path: report/
          retention-days: 30
          if-no-files-found: warn
