name: HONOR70 Original C431 Kernel Hardening IKCONFIG Inventory

on:
  push:
    paths:
      - 'tools/audit_c431_original_kernel_hardening.py'
      - 'tools/test_audit_c431_original_kernel_hardening.py'
      - '.github/workflows/audit-c431-original-kernel-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run strict synthetic hardening-config tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_c431_original_kernel_hardening.py
          python3 -m unittest discover -s tools \
            -p 'test_audit_c431_original_kernel_hardening.py' -v
      - name: Download exact original signed C431 boot from verified prior run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source data report
          gh run download 42530238358 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_STOCK_BOOT_FOR_GHOSTLOCK_PROFILE \
            --dir source
          echo '5f27556ef26cf84f8ad6ff304a966c4b246091c01c89d8fd8f33e5526f7f3256  source/boot.img' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import struct,hashlib
          b=Path('source/boot.img').read_bytes()
          assert b[:8]==b'ANDROID!' and struct.unpack_from('<I',b,40)[0]==3
          length=struct.unpack_from('<I',b,8)[0]
          data=b[4096:4096+length]
          assert hashlib.sha256(data).hexdigest()=='bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece'
          Path('data/kernel.Image').write_bytes(data)
          PY
      - name: Record only build hardening flags, with no device operation
        run: |
          set -euo pipefail
          python3 tools/audit_c431_original_kernel_hardening.py \
            --kernel data/kernel.Image \
            --out report/FNE_NX9_C431_ORIGINAL_KERNEL_HARDENING.json \
            | tee report/HARDENING_SUMMARY.txt
          python3 -m json.tool report/FNE_NX9_C431_ORIGINAL_KERNEL_HARDENING.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: HONOR70_C431_VERIFIED_KERNEL_HARDENING
          path: report/
          if-no-files-found: error
          retention-days: 30
