name: Honor70 Check Public Firmware Mirrors
on:
  push:
    paths:
      - '.github/workflows/probe-board-firmware-mirrors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public firmware listings and download URLs without downloading archives
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          import requests,re
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.entries=[];self.href=None;self.text=''
            def handle_starttag(self,tag,attrs):
              if tag=='a':
                self.href=dict(attrs).get('href');self.text=''
            def handle_data(self,data):
              if self.href is not None:self.text+=data
            def handle_endtag(self,tag):
              if tag=='a' and self.href is not None:
                self.entries.append((self.href,self.text.strip()))
                self.href=None
          urls=[
            'https://huaweistockrom.com/honor-70-fne-an00/',
            'https://firmwarefile.com/honor-70-fne-an00/',
            'https://firmwaredrive.com/folders/51027',
            'https://romdevelopers.com/index.php?a=downloads&b=tags&tag=Honor+70+%28FNE-AN00%29',
            'https://www.firmwarebd.com/2025/04/honor-70-fne-an00-flash-file-firmware.html',
          ]
          session=requests.Session();session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/132.0.0.0 Safari/537.36'})
          for url in urls:
            print('\n=== SOURCE ===',url)
            try:
              r=session.get(url,timeout=17,allow_redirects=True,stream=True)
              print('HTTP',r.status_code,'FINAL',r.url,'CT',r.headers.get('Content-Type'))
              data=bytearray()
              for c in r.iter_content(16384):
                if c:data.extend(c)
                if len(data)>300000:break
              r.close()
              if 'html' not in r.headers.get('Content-Type',''):continue
              html=data.decode('utf8','replace');p=Links();p.feed(html)
              matches=[(urljoin(r.url,href),label) for href,label in p.entries
                       if any(w in (href+' '+label).lower() for w in ('download','mirror','drive.google','mediafire','mega','terabox','androidfilehost','zip','fne-an00'))]
              print('HTML_BYTES',len(html),'CANDIDATE_LINKS',len(matches))
              for href,label in matches[:26]:print('LINK',label[:80],href[:450])
            except Exception as e:print('ERROR',type(e).__name__,str(e)[:220])
          PY
