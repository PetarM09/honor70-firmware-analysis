name: Honor 70 Recover Kernel Symbols and RTMutex
on:
  push:
    paths:
      - '.github/workflows/recover-rtmutex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install symbol recovery tooling
        run: |
          python3 -m pip install --quiet --break-system-packages vmlinux-to-elf pyelftools capstone
      - name: Download original 14-part firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts report
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
      - name: Recover original Image from boot.img
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import bisect,zipfile,struct,shutil,hashlib
          parts=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          assert [p.name for p in parts]==[f'HONOR70_FW_part_aa{chr(97+i)}' for i in range(14)]
          class Reader:
            def __init__(self,ps):
              self.fs=[p.open('rb') for p in ps];self.ends=[0];self.pos=0
              for p in ps:self.ends.append(self.ends[-1]+p.stat().st_size)
            def tell(self):return self.pos
            def seekable(self):return True
            def seek(self,x,w=0):self.pos=[0,self.pos,self.ends[-1]][w]+x;return self.pos
            def read(self,n=-1):
              if n<0:n=self.ends[-1]-self.pos
              n=min(n,max(0,self.ends[-1]-self.pos));out=bytearray()
              while n:
                i=bisect.bisect_right(self.ends,self.pos)-1
                if i>=len(self.fs):break
                step=min(n,self.ends[i+1]-self.pos)
                self.fs[i].seek(self.pos-self.ends[i]);b=self.fs[i].read(step)
                if len(b)!=step:raise IOError('truncated')
                out.extend(b);self.pos+=step;n-=step
              return bytes(out)
            def close(self):
              for f in self.fs:f.close()
          r=Reader(parts)
          try:
            with zipfile.ZipFile(r) as z:
              f=z.getinfo('Software/dload/update_sd_base.zip')
              assert shutil.disk_usage('.').free>f.file_size+1024**3
              with z.open(f) as src,open('base.zip','wb') as dst:shutil.copyfileobj(src,dst,8*1024*1024)
          finally:r.close()
          with zipfile.ZipFile('base.zip') as z:
            boot=z.read('image/boot.img')
          assert boot[:8]==b'ANDROID!' and struct.unpack_from('<I',boot,40)[0]==3
          size=struct.unpack_from('<I',boot,8)[0]
          data=boot[4096:4096+size]
          assert hashlib.sha256(data).hexdigest()=='bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece'
          Path('Image').write_bytes(data)
          print('RECOVERED_KERNEL',len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Recover kallsyms from exact kernel
        run: |
          set +e
          vmlinux-to-elf Image vmlinux.elf > report/RECOVERY_LOG.txt 2>&1
          rc=$?
          echo "SYMBOL_RECOVERY_EXIT=$rc"
          tail -80 report/RECOVERY_LOG.txt
          if [ -e vmlinux.elf ]; then
            echo "ELF_BYTES=$(stat -c%s vmlinux.elf)"
            readelf -h vmlinux.elf > report/ELF_HEADER.txt
            python3 - <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          names=['remove_waiter','rt_mutex_start_proxy_lock','rt_mutex_adjust_prio_chain','futex_requeue','futex_requeue_pi','rt_mutex_lock']
          found=[]
          with open('vmlinux.elf','rb') as f:
            e=ELFFile(f)
            for sec in e.iter_sections():
              if sec.header.sh_type!='SHT_SYMTAB':continue
              for sym in sec.iter_symbols():
                if any(n in sym.name for n in names):
                  found.append((sym.name,sym.entry.st_value,sym.entry.st_size))
            print('SYMBOLS_MATCHING',len(found))
            lines=[]
            md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
            for name,va,size in found[:100]:
              lines.append(f'SYMBOL {name} VA={hex(va)} SIZE={size}')
              if 'remove_waiter' not in name:continue
              for sec in e.iter_sections():
                if sec.header.sh_addr<=va<sec.header.sh_addr+sec.header.sh_size and sec.header.sh_type=='SHT_PROGBITS':
                  off=va-sec.header.sh_addr
                  code=sec.data()[off:off+min(max(size,300),1600)]
                  for ins in md.disasm(code,va):
                    lines.append(f'{ins.address:x} {ins.mnemonic} {ins.op_str}')
                  break
            Path('report/RTMUTEX_SYMBOLS_AND_DISASM.txt').write_text('\n'.join(lines)+'\n')
            print('\n'.join(lines)[:25000])
          PY
          else
            echo "NO_RECOVERED_ELF" > report/RTMUTEX_SYMBOLS_AND_DISASM.txt
          fi
          exit 0
      - name: Save kernel forensic report
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_RTMUTEX_FORENSICS
          path: report/
          retention-days: 7
