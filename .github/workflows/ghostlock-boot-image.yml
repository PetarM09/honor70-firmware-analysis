name: Honor 70 Prepare Stock Boot Image for GhostLock Profile
on:
  push:
    paths:
      - '.github/workflows/ghostlock-boot-image.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch signed stock firmware and XBL config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts out prev
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
          gh run download 42527019027 --repo "$GITHUB_REPOSITORY" --name HONOR70_DEEP_BOOTCHAIN --dir prev
      - name: Validate and extract original boot image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import bisect,zipfile,struct,shutil,hashlib
          parts=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          assert [p.name for p in parts]==[f'HONOR70_FW_part_aa{chr(97+i)}' for i in range(14)]
          class Joined:
            def __init__(self,paths):
              self.files=[p.open('rb') for p in paths]
              self.end=[0];self.pos=0
              for p in paths:self.end.append(self.end[-1]+p.stat().st_size)
            def tell(self):return self.pos
            def seekable(self):return True
            def seek(self,v,w=0):self.pos=[0,self.pos,self.end[-1]][w]+v;return self.pos
            def read(self,n=-1):
              if n<0:n=self.end[-1]-self.pos
              n=min(n,max(0,self.end[-1]-self.pos))
              out=bytearray()
              while n:
                idx=bisect.bisect_right(self.end,self.pos)-1
                if idx>=len(self.files):break
                step=min(n,self.end[idx+1]-self.pos)
                self.files[idx].seek(self.pos-self.end[idx])
                chunk=self.files[idx].read(step)
                if len(chunk)!=step:raise IOError('truncated part')
                out.extend(chunk);self.pos+=step;n-=step
              return bytes(out)
            def close(self):
              for f in self.files:f.close()
          r=Joined(parts)
          try:
            with zipfile.ZipFile(r) as z:
              e=z.getinfo('Software/dload/update_sd_base.zip')
              assert shutil.disk_usage('.').free>e.file_size+1024**3
              with z.open(e) as i,open('inner.zip','wb') as o:shutil.copyfileobj(i,o,8*1024*1024)
          finally:r.close()
          with zipfile.ZipFile('inner.zip') as z:
            data=z.read('image/boot.img')
          sha=hashlib.sha256(data).hexdigest()
          assert sha=='5f27556ef26cf84f8ad6ff304a966c4b246091c01c89d8fd8f33e5526f7f3256',sha
          assert data[:8]==b'ANDROID!'
          Path('out/boot.img').write_bytes(data)
          xc=Path('prev/keybins/xbl_config.elf')
          if xc.exists(): shutil.copyfile(xc,'out/xbl_config.elf')
          Path('out/README.txt').write_text(
             'HONOR70 FNE-NX9 / FNE-N29 MagicOS 8.0.0.290 stock, unmodified images.\n'
             'boot.img SHA256: '+sha+'\n'
             'Kernel SHA256: bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece\n'
             'For offline profile creation and compatibility checks only.\n'
             'Do not flash these files to the phone without verified partition matching.\n')
          print('VALIDATED_STOCK_BOOT',len(data),sha)
          PY
      - name: Publish offline profile inputs
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_STOCK_BOOT_FOR_GHOSTLOCK_PROFILE
          path: out/
          retention-days: 7
