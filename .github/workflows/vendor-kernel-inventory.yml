name: Honor 70 Vendor and Kernel Inventory
on:
  push:
    paths:
      - '.github/workflows/vendor-kernel-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts report
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
      - name: Detect vendor image format and boot kernel
        run: |
          python3 - <<'PY'
          import bisect,zipfile,shutil,subprocess,hashlib,struct
          from pathlib import Path
          paths=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          class Joined:
            def __init__(self,paths):
              self.f=[p.open('rb') for p in paths];self.pos=0;self.end=[0]
              for p in paths:self.end.append(self.end[-1]+p.stat().st_size)
            def tell(self):return self.pos
            def seekable(self):return True
            def seek(self,x,w=0):self.pos=[0,self.pos,self.end[-1]][w]+x;return self.pos
            def read(self,n=-1):
              if n<0:n=self.end[-1]-self.pos
              n=min(n,max(0,self.end[-1]-self.pos));out=bytearray()
              while n:
                i=bisect.bisect_right(self.end,self.pos)-1
                if i>=len(self.f):break
                step=min(n,self.end[i+1]-self.pos)
                self.f[i].seek(self.pos-self.end[i]);b=self.f[i].read(step)
                if len(b)!=step:raise IOError('truncated')
                out+=b;self.pos+=step;n-=step
              return bytes(out)
            def close(self):
              for f in self.f:f.close()
          joined=Joined(paths)
          try:
            with zipfile.ZipFile(joined) as z:
              e=z.getinfo('Software/dload/update_sd_base.zip')
              assert shutil.disk_usage('.').free > e.file_size + 1024**3
              with z.open(e) as r,open('base.zip','wb') as f:shutil.copyfileobj(r,f,8*1024*1024)
          finally:joined.close()
          entries=['image/vendor.img','image/boot.img','image/system_ext.img']
          with zipfile.ZipFile('base.zip') as z:
            for e in entries:
              if e not in z.namelist():continue
              with z.open(e) as r,open(Path(e).name,'wb') as f:shutil.copyfileobj(r,f,8*1024*1024)
          out=[]
          for name in ['vendor.img','boot.img','system_ext.img']:
            p=Path(name)
            if not p.exists():continue
            data=p.open('rb').read(4096)
            out+=[f'=== {name} ===',f'SIZE {p.stat().st_size}',
                  'FILE: '+subprocess.run(['file','-b',str(p)],capture_output=True,text=True).stdout.strip(),
                  'HEAD64 '+data[:64].hex()]
            if name=='boot.img' and data.startswith(b'ANDROID!'):
              out.append(f'kernel_size_le_8 {struct.unpack_from("<I",data,8)[0]}')
              out.append(f'header_version_le_40 {struct.unpack_from("<I",data,40)[0]}')
              out.append(f'ramdisk_size_le_12 {struct.unpack_from("<I",data,12)[0]}')
            if name.endswith('.img') and data[:4]==b'\x3a\xff\x26\xed':
              major,minor,fh,ch,blk,total_blocks,total_chunks=struct.unpack_from('<HHHHIII',data,4)
              out.append(f'SPARSE major={major} minor={minor} file_header={fh} chunk_header={ch} block_size={blk} total_blocks={total_blocks} chunks={total_chunks}')
          Path('report/FS_INVENTORY.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_FS_KERNEL_INVENTORY
          path: report/
          retention-days: 7
