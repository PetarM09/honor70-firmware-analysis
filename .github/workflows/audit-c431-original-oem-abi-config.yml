name: HONOR70 Signed C431 OEM ABI Kernel Config Comparison

on:
  push:
    paths:
      - 'tools/audit_c431_original_vendor_abi_config.py'
      - 'tools/test_audit_c431_original_vendor_abi_config.py'
      - '.github/workflows/audit-c431-original-oem-abi-config.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Test signed original OEM config parser
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_c431_original_vendor_abi_config.py
          python3 -m unittest discover -s tools \
            -p 'test_audit_c431_original_vendor_abi_config.py' -v
      - name: Retrieve original user-owned signed C431 boot source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs report
          gh run download 42530238358 --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_STOCK_BOOT_FOR_GHOSTLOCK_PROFILE \
            --dir inputs
          echo '5f27556ef26cf84f8ad6ff304a966c4b246091c01c89d8fd8f33e5526f7f3256  inputs/boot.img' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          b=Path("inputs/boot.img").read_bytes()
          assert b[:8]==b"ANDROID!"
          assert struct.unpack_from("<I",b,40)[0]==3
          size=struct.unpack_from("<I",b,8)[0]
          raw=b[4096:4096+size]
          assert hashlib.sha256(raw).hexdigest()=='bd8622b9448e435fb1459cefab59458988fc85c02a829cb5f47f9b03cc2c2ece'
          Path("inputs/kernel.Image").write_bytes(raw)
          PY
      - name: Inventory OEM kernel ABI configuration from exact C431 Image
        run: |
          set -euo pipefail
          python3 tools/audit_c431_original_vendor_abi_config.py \
            --kernel inputs/kernel.Image \
            --out report/C431_ORIGINAL_OEM_ABI_COMPILE_FLAGS.json \
            | tee report/FLAGS_SUMMARY.txt
          python3 -m json.tool report/C431_ORIGINAL_OEM_ABI_COMPILE_FLAGS.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HONOR70_C431_SIGNED_OEM_ABI_FEATURE_FLAGS
          path: report/
          retention-days: 30
          if-no-files-found: warn
