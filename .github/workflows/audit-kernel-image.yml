name: Honor 70 Audit Exact Boot Kernel
on:
  push:
    paths:
      - '.github/workflows/audit-kernel-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download original firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts results
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
      - name: Extract original kernel for patch triage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,shutil,bisect,hashlib,re,subprocess,gzip,lzma
          paths=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          assert len(paths)==14
          class Joined:
            def __init__(self,ps):
              self.fs=[p.open('rb') for p in ps];self.offsets=[0];self.pos=0
              for p in ps:self.offsets.append(self.offsets[-1]+p.stat().st_size)
            def tell(self):return self.pos
            def seekable(self):return True
            def seek(self,n,w=0):self.pos=[0,self.pos,self.offsets[-1]][w]+n;return self.pos
            def read(self,n=-1):
              if n<0:n=self.offsets[-1]-self.pos
              n=min(n,max(0,self.offsets[-1]-self.pos))
              out=bytearray()
              while n:
                i=bisect.bisect_right(self.offsets,self.pos)-1
                if i>=len(self.fs):break
                count=min(n,self.offsets[i+1]-self.pos)
                self.fs[i].seek(self.pos-self.offsets[i])
                b=self.fs[i].read(count)
                if len(b)!=count:raise IOError('short read')
                self.pos+=count;n-=count;out+=b
              return bytes(out)
            def close(self):
              for f in self.fs:f.close()
          join=Joined(paths)
          try:
            with zipfile.ZipFile(join) as z:
              f=z.getinfo('Software/dload/update_sd_base.zip')
              assert shutil.disk_usage('.').free>f.file_size+1024**3
              with z.open(f) as i,open('base.zip','wb') as o:shutil.copyfileobj(i,o,8*1024*1024)
          finally:join.close()
          with zipfile.ZipFile('base.zip') as z:
            with z.open('image/boot.img') as i,open('boot.img','wb') as o:shutil.copyfileobj(i,o,8*1024*1024)
          data=Path('boot.img').read_bytes()
          assert data[:8]==b'ANDROID!'
          kernel_size=struct.unpack_from('<I',data,8)[0]
          v=struct.unpack_from('<I',data,40)[0]
          assert v==3 and kernel_size<90*1024*1024
          kernel=data[4096:4096+kernel_size]
          lines=[f'Boot_header_version: {v}',f'Kernel_size: {len(kernel)}',
                 f'Kernel_SHA256: {hashlib.sha256(kernel).hexdigest()}',
                 'Kernel_prefix_128: '+kernel[:128].hex(),
                 'Kernel_file: '+subprocess.run(['file','-b','-'],input=kernel[:65536],capture_output=True).stdout.decode(errors='replace').strip()]
          tokens=[b'Linux version ',b'5.4.295',b'ghostlock',b'remove_waiter',b'rt_mutex_start_proxy_lock',b'CONFIG_FUTEX_PI',b'CONFIG_CFI_CLANG',b'MZ',b'\x1f\x8b',b'\x02\x21\x4c\x18',b'\x04\x22\x4d\x18']
          for token in tokens:
            offsets=[m.start() for m in list(re.finditer(re.escape(token),kernel))[:15]]
            lines.append(repr(token)+': '+','.join(hex(x) for x in offsets))
          lines.append('NOTE: mere string search cannot establish whether GhostLock was patched. Need exact remove_waiter implementation or matching source code.')
          Path('results/KERNEL_AUDIT.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Upload triage report
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_KERNEL_IMAGE_AUDIT
          path: results/
          retention-days: 7
