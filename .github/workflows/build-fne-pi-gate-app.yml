name: HONOR70 Safe Android App PI Futex Gate APK

on:
  push:
    paths:
      - 'android/fne-pi-gate/**'
      - 'profiles/fne-nx9-c431-8.0.0.290.profile.json'
      - 'tools/check_fne_c431_profile.py'
      - 'tools/test_check_fne_c431_profile.py'
      - '.github/workflows/build-fne-pi-gate-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence-only exact C431 profile and bundle into Android assets
        run: |
          set -euo pipefail
          python3 tools/check_fne_c431_profile.py --out report/PROFILE_STATIC_PREFLIGHT.json
          python3 -m unittest discover -s tools -p 'test_check_fne_c431_profile.py' -v
          mkdir -p android/fne-pi-gate/app/src/main/assets
          cp profiles/fne-nx9-c431-8.0.0.290.profile.json \
            android/fne-pi-gate/app/src/main/assets/fne-c431-profile.json
          sha256sum profiles/fne-nx9-c431-8.0.0.290.profile.json \
            | tee report/PROFILE_SHA256.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install stable Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;26.3.11579264'
      - name: Build ARM64 JNI with uncontended PI test and invalid-address early-rejection probe
        run: |
          set -euo pipefail
          mkdir -p android/fne-pi-gate/app/src/main/jniLibs/arm64-v8a report
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-z,noexecstack -Wl,-soname,libfnepi.so \
            -o android/fne-pi-gate/app/src/main/jniLibs/arm64-v8a/libfnepi.so \
            android/fne-pi-gate/app/src/main/c/fne_pi_gate.c
          file android/fne-pi-gate/app/src/main/jniLibs/arm64-v8a/libfnepi.so | tee report/JNI_TARGET.txt
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h \
            android/fne-pi-gate/app/src/main/jniLibs/arm64-v8a/libfnepi.so \
            | tee report/JNI_ELF_HEADER.txt
          grep -q 'Machine:.*AArch64' report/JNI_ELF_HEADER.txt
          grep -Fq 'long rc = syscall(SYS_futex, &word, FUTEX_CMP_REQUEUE_PI | FUTEX_PRIVATE_FLAG,' android/fne-pi-gate/app/src/main/c/fne_pi_gate.c
          grep -Fq '1, (void *)0, &word, 0);' android/fne-pi-gate/app/src/main/c/fne_pi_gate.c
      - name: Build debug APK - no app permissions
        working-directory: android/fne-pi-gate
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Audit APK and archive checksums
        run: |
          set -euo pipefail
          APK=android/fne-pi-gate/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee report/APK_MEMBERS.txt
          grep -q 'lib/arm64-v8a/libfnepi.so' report/APK_MEMBERS.txt
          grep -q 'assets/fne-c431-profile.json' report/APK_MEMBERS.txt
          unzip -p "$APK" assets/fne-c431-profile.json \
            | sha256sum \
            | cut -d' ' -f1 \
            > report/APK_EMBEDDED_PROFILE_SHA256.txt
          cmp report/APK_EMBEDDED_PROFILE_SHA256.txt \
            <(cut -d' ' -f1 report/PROFILE_SHA256.txt)

          test "$(grep -c 'lib/.*libfnepi.so' report/APK_MEMBERS.txt)" = 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
            | tee report/APK_PERMISSIONS.txt
          ! grep -q 'uses-permission' report/APK_PERMISSIONS.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee report/APK_BADGING.txt
          grep -Fq "application: label='FNE PI Gate'" report/APK_BADGING.txt
          grep -Fq "versionCode='3'" report/APK_BADGING.txt
          sha256sum "$APK" | tee report/APK_SHA256.txt
          sha256sum android/fne-pi-gate/app/src/main/jniLibs/arm64-v8a/libfnepi.so \
            | tee report/JNI_SHA256.txt
          cp "$APK" report/HONOR70_C431_PROFILE_PREFLIGHT_V03.apk
          printf 'FNE PI Gate v0.3: zero-permission C431 profile identity preflight + previous safe PI futex tests. Asset exact SHA audited; no user-data upload.\nNo active GhostLock waiters, UAF, root, kernel memory write, EDL or bootloader unlock.\nSigned with ephemeral CI debug key.\n' > report/SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HONOR70_C431_PROFILE_PREFLIGHT_V03_ANDROID_APK
          path: report/
          retention-days: 30
