name: Honor70 Parse Stock GPT for GBL Support
on:
  push:
    paths:
      - '.github/workflows/parse-stock-gpt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch firmware release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts results
          gh release download v8.0.0.290 --repo "$GITHUB_REPOSITORY" --pattern "HONOR70_FW_part_*" --dir parts
          df -h .
      - name: Extract and inspect nested ZIP safely
        run: |
          python3 - <<'PY'
          import bisect, zipfile, shutil, os, hashlib
          from pathlib import Path

          files=sorted(Path('parts').glob('HONOR70_FW_part_*'))
          expected=[f'HONOR70_FW_part_aa{chr(97+i)}' for i in range(14)]
          assert [p.name for p in files]==expected, 'Firmware parts missing or out of order'
          class Joined:
              def __init__(self,files):
                  self.fs=[p.open('rb') for p in files]; self.ends=[0]
                  for p in files:self.ends.append(self.ends[-1]+p.stat().st_size)
                  self.pos=0
              def seekable(self):return True
              def tell(self):return self.pos
              def seek(self,o,w=0):
                  self.pos=([0,self.pos,self.ends[-1]][w])+o
                  if self.pos<0:raise ValueError('negative seek')
                  return self.pos
              def read(self,n=-1):
                  if n is None or n<0:n=self.ends[-1]-self.pos
                  n=min(n,max(0,self.ends[-1]-self.pos))
                  out=bytearray()
                  while n:
                      i=bisect.bisect_right(self.ends,self.pos)-1
                      if i>=len(self.fs):break
                      count=min(n,self.ends[i+1]-self.pos)
                      f=self.fs[i];f.seek(self.pos-self.ends[i])
                      c=f.read(count)
                      if len(c)!=count:raise IOError('incomplete firmware piece')
                      out.extend(c); self.pos+=count;n-=count
                  return bytes(out)
              def close(self):
                  for f in self.fs:f.close()

          reader=Joined(files)
          inner_path=Path('update_sd_base.zip')
          try:
              with zipfile.ZipFile(reader) as outer:
                  info=outer.getinfo('Software/dload/update_sd_base.zip')
                  print('OUTER_MEMBER',info.filename,info.file_size,info.compress_size)
                  free=shutil.disk_usage('.').free
                  if free < info.file_size+1024**3:
                      raise RuntimeError('Insufficient disk space to safely extract inner ZIP')
                  with outer.open(info) as stream,inner_path.open('wb') as dst:
                      shutil.copyfileobj(stream,dst,8*1024*1024)
          finally:
              reader.close()

          with zipfile.ZipFile(inner_path) as inner:
              gpt=inner.read('gpt_both0.bin')
          import struct,uuid,re,hashlib
          print('GPT_BYTES',len(gpt),'SHA256',hashlib.sha256(gpt).hexdigest())
          lines=[]
          def note(s):lines.append(s)
          header_offsets=[m.start() for m in re.finditer(b'EFI PART',gpt)]
          note('GPT_HEADER_OFFSETS '+','.join(hex(o) for o in header_offsets))
          Path('results/gpt_both0.bin').write_bytes(gpt)
          total=0
          for lun,hd in enumerate(header_offsets):
              if hd+92>len(gpt):continue
              revision,hlen=struct.unpack_from('<II',gpt,hd+8)
              current_lba,backup_lba,first_usable,last_usable=struct.unpack_from('<QQQQ',gpt,hd+24)
              table_lba,num_entries,entry_size=struct.unpack_from('<QII',gpt,hd+72)
              if current_lba!=1:
                  continue  # skip backup GPTs for the same UFS LUN
              note(f'LUN_HEADER at 0x{hd:x} revision=0x{revision:x} header_size={hlen} current_lba={current_lba} table_lba={table_lba} entries={num_entries} entry_size={entry_size}')
              if entry_size not in (128,256) or num_entries>2048:
                  note('SKIPPED_UNEXPECTED_ENTRY_SIZE');continue
              # UFS partition tables have 4096-byte LBAs. The entire GPT for each LUN
              # is concatenated in this 270336-byte update image.
              logical_sector=4096
              segment_start=hd-logical_sector
              base=segment_start+table_lba*logical_sector
              if base+entry_size*num_entries>len(gpt):
                  note('ENTRY_TABLE_OUTSIDE_BUFFER');continue
              import zlib
              expected_crc=struct.unpack_from('<I',gpt,hd+88)[0]
              actual_crc=zlib.crc32(gpt[base:base+entry_size*num_entries]) & 0xffffffff
              note(f'ENTRY_CRC32 expected=0x{expected_crc:08x} actual=0x{actual_crc:08x} valid={expected_crc==actual_crc}')
              for i in range(num_entries):
                  off=base+i*entry_size
                  e=gpt[off:off+entry_size]
                  if e[:16]==b'\x00'*16:continue
                  first,last,attrs=struct.unpack_from('<QQQ',e,32)
                  name=e[56:128].decode('utf-16le','replace').split('\x00')[0]
                  if not name.strip():continue
                  total+=1
                  note(f'PARTITION LUNheader=0x{hd:x} index={i:03d} name={name} first={first} last={last} sectors={last-first+1}')
          note('TOTAL_PARTITIONS '+str(total))
          names=[x.lower() for x in lines if x.startswith('PARTITION ')]
          note('EFISP_OR_GBL_NAME_FOUND '+str(any('efisp' in x or 'gbl' in x for x in names)))
          Path('results/GPT_GBL_EFISP_PARTITIONS.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines)[:25000])
          PY
      - name: Upload GPT inventory
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_GPT_GBL_INVENTORY
          path: results/
          retention-days: 14
