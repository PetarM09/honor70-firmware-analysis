name: HONOR70 All 67 Signed KM41 Handler Security Gate Inventory
on:
  push:
    paths:
      - '.github/workflows/scan-km41-all-67-state-storage-handlers.yml'
      - 'tools/ghidra/Honor70KM41AllHandlersSecuritySurface.java'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out analysis scripts
        uses: actions/checkout@v4
      - name: Retrieve stock signed Keymaster
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p samples analysis
          gh run download 42539482630 --repo "$GITHUB_REPOSITORY" --name HONOR70_MATCHING_SECURE_BOOT_MODULES --dir samples
          sha256sum samples/exports/km41.mbn
          echo "c7f389b80444a9c9e3956efd427abbae1b5b2753b3c905107ca7888dca496afd  samples/exports/km41.mbn" | sha256sum -c
      - name: Obtain pinned Ghidra
        run: |
          curl -fL --retry 3 -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  /tmp/ghidra.zip' | sha256sum -c
          mkdir -p dist
          unzip -q /tmp/ghidra.zip -d dist
          rm /tmp/ghidra.zip
          echo "GHIDRA_HEADLESS=$(find dist -type f -name analyzeHeadless | head -1)" >> "$GITHUB_ENV"
      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect exact original KM41 command table and 0x10E handler
        run: |
          mkdir -p /tmp/ghidra-km41
          "$GHIDRA_HEADLESS" /tmp/ghidra-km41 HONOR70_KM41 \
            -import "$GITHUB_WORKSPACE/samples/exports/km41.mbn" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript Honor70KM41AllHandlersSecuritySurface.java \
            -analysisTimeoutPerFile 950 -max-cpu 2 -deleteProject \
            > analysis/GHIDRA_KEYMASTER_LOG.txt 2>&1 || {
              tail -120 analysis/GHIDRA_KEYMASTER_LOG.txt
              exit 1
            }
          python3 - <<'PY'
          from pathlib import Path
          import csv
          path=Path('analysis/KM41_ALL_67_HANDLER_SECURITY_SURFACE.tsv')
          assert path.exists()
          with path.open() as f:
              reader=csv.DictReader((x for x in f if not x.startswith('#')), delimiter='\t')
              rows=list(reader)
          assert len(rows)==67, f"Only {len(rows)} of 67 callbacks enumerated"
          by_id={x['CMD']:x for x in rows}
          for cmd in ('0x202','0x203','0x204'):
              assert cmd in by_id, f"Missing registered signed Keymaster {cmd}"
          for cmd in ('0x202','0x203'):
              assert by_id[cmd]['CALL_FUSE']=='true',f"No protected fuse guard in {cmd}"
          for x in rows:
              print('REGISTERED_SECURITY_HANDLER',x['CMD'],
                    'FLAGS',x['FLAGS'],'FUNC',x['CALLBACK'],
                    'DECOMP',x['DECOMP_OK'],
                    'FUSE',x['CALL_FUSE'],
                    'STORREAD',x['CALL_QSEE_STOR_READ'],
                    'STORWRITE',x['CALL_QSEE_STOR_WRITE'],
                    'BLOW',x['CALL_BLOW_FUSE'],
                    'DIRECT_CALLEES',x['DIRECT_CALLS'][:250])
          print('ALL_67_KM41_CALLBACKS_ENUMERATED',len(rows))
          PY
      - name: Save complete read-only reverse engineering result
        uses: actions/upload-artifact@v4
        with:
          name: HONOR70_KM41_ALL_67_HANDLER_SECURITY_SOURCE
          path: analysis/
          retention-days: 14
