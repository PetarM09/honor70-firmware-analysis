name: HONOR70 Original C431 Task PI Layout Evidence

on:
  push:
    paths:
      - 'tools/audit_exact_c431_task_pi_layout.py'
      - 'tools/test_audit_exact_c431_task_pi_layout.py'
      - '.github/workflows/audit-exact-c431-task-pi-layout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression tests without a phone
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_exact_c431_task_pi_layout.py
          python3 -m unittest discover -s tools -p 'test_audit_exact_c431_task_pi_layout.py' -v
      - name: Fetch SHA-verified original kernel disassembly and HONOR GPL reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/gpl report
          gh run download 43228734050 \
            --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_EXACT_C431_ARM64_RT_MUTEX_ABI_SITES \
            --dir evidence/kernel
          gh run download 43162235496 \
            --repo "$GITHUB_REPOSITORY" \
            --name HONOR70_FENNIE_8_CORE_KERNEL_SOURCES \
            --dir evidence/gpl
          echo '9f93a2b3c26269a749db7ca74ac184812249be60280012cd3e7d43ac7bc3f024  evidence/gpl/FENNIE/include_sched_h.txt' | sha256sum -c
          echo '70f96efb8e45b97b977957e3ecb93a4e63fcaf4e2b7d915d20316f3c4e6263b9  evidence/gpl/FENNIE/kernel_rtmutex_c.txt' | sha256sum -c
      - name: Crosscheck C431 task PI disassembly against HONOR GPL source
        run: |
          set -euo pipefail
          python3 tools/audit_exact_c431_task_pi_layout.py \
            --arm64-report evidence/kernel/C431_ORIGINAL_RT_MUTEX_MEMORY_INSTRUCTIONS.json \
            --sched evidence/gpl/FENNIE/include_sched_h.txt \
            --rtmutex evidence/gpl/FENNIE/kernel_rtmutex_c.txt \
            --out report/C431_ORIGINAL_TASK_PI_LAYOUT_EVIDENCE.json
          python3 -m json.tool report/C431_ORIGINAL_TASK_PI_LAYOUT_EVIDENCE.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HONOR70_C431_TASK_PI_LAYOUT_EVIDENCE
          path: report/
          retention-days: 30
          if-no-files-found: warn
